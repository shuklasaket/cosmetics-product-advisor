repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types_or: [python, pyi]
      - id: documentation
        name: Local documentation and diagram references
        entry: uv run --frozen python -m scripts.check_docs
        language: system
        pass_filenames: false
        files: '(^docs/|\.md$)'
