<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <rect width="1280" height="820" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#62748A"/></marker></defs>
  <style>text{font-family:Helvetica,Arial,sans-serif;fill:#172B4D}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#52657D}.box{font-size:15px;font-weight:600}.small{font-size:13px;fill:#52657D}.edge{stroke:#62748A;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <text x="40" y="52" class="title">One local app with a trusted controller and five fixed roles</text>
  <text x="40" y="82" class="sub">Implemented foundation at the top; planned bounded role workflow below. Only the approved source is remote.</text>
  <path d="M190 155 H227 M445 155 H492 M650 200 V330 M1038 200 V527 M1040 577 H1072" class="edge"/>
  <path d="M160 385 H277 M380 385 H497 M600 385 H717 M820 385 H937" class="edge" stroke="#7251A0"/>
  <path d="M1040 385 V235 H800" class="edge" stroke="#7251A0"/>
  <path d="M650 200 V527 H720 M500 200 V577 H315" class="edge"/>
  <rect x="40" y="120" width="150" height="70" rx="12" fill="#EAF1FB" stroke="#365B8C" stroke-width="2"/><text x="115" y="160" text-anchor="middle" class="box">Shopper / operator</text>
  <rect x="235" y="120" width="210" height="70" rx="12" fill="#DDEBFC" stroke="#365B8C" stroke-width="2"/><text x="340" y="145" text-anchor="middle" class="box">Streamlit UI</text><text x="340" y="166" text-anchor="middle" class="small">form + catalog now · conversation later</text>
  <rect x="500" y="110" width="300" height="90" rx="12" fill="#E1D5E7" stroke="#9673A6" stroke-width="2"/><text x="650" y="140" text-anchor="middle" class="box">Trusted controller</text><text x="650" y="163" text-anchor="middle" class="small">run context · limits · validation · redaction</text><text x="650" y="182" text-anchor="middle" class="small">cancellation · publication</text>
  <path d="M970 135 Q1085 95 1200 135 V185 Q1085 225 970 185 Z" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/><ellipse cx="1085" cy="135" rx="115" ry="20" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/><text x="1085" y="157" text-anchor="middle" class="box">SQLite repository</text><text x="1085" y="178" text-anchor="middle" class="small">evidence · public artifacts · preferences · events</text>
  <rect x="40" y="270" width="1160" height="180" rx="6" fill="#F5F0F8" stroke="#9673A6" stroke-width="2"/><text x="58" y="294" class="box">Fixed role chain — controller-mediated typed handoffs only</text>
  <g fill="#E1D5E7" stroke="#9673A6" stroke-width="2"><rect x="65" y="336" width="190" height="75" rx="12"/><rect x="285" y="336" width="190" height="75" rx="12"/><rect x="505" y="336" width="190" height="75" rx="12"/><rect x="945" y="336" width="210" height="75" rx="12"/></g>
  <rect x="725" y="336" width="190" height="75" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/>
  <text x="160" y="365" text-anchor="middle" class="box">1. Intake and Clarification</text><text x="160" y="389" text-anchor="middle" class="small">local extraction; no tools</text>
  <text x="380" y="365" text-anchor="middle" class="box">2. Catalog Evidence</text><text x="380" y="389" text-anchor="middle" class="small">allowlisted facts and retrieval</text>
  <text x="600" y="365" text-anchor="middle" class="box">3. Review Evidence</text><text x="600" y="389" text-anchor="middle" class="small">bounded review model only</text>
  <text x="820" y="365" text-anchor="middle" class="box">4. Policy and Ranking</text><text x="820" y="389" text-anchor="middle" class="small">Python-only screening and score</text>
  <text x="1050" y="365" text-anchor="middle" class="box">5. Explanation and Citation</text><text x="1050" y="389" text-anchor="middle" class="small">bounded claims; validated fallback</text>
  <rect x="40" y="535" width="275" height="85" rx="12" fill="#FFF2CC" stroke="#D6B656" stroke-width="2"/><text x="177" y="563" text-anchor="middle" class="box">Session only</text><text x="177" y="586" text-anchor="middle" class="small">budget · exclusions · raw chat</text><text x="177" y="604" text-anchor="middle" class="small">active results and role payloads</text>
  <rect x="380" y="535" width="340" height="85" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/><text x="550" y="563" text-anchor="middle" class="box">Shared deterministic services</text><text x="550" y="586" text-anchor="middle" class="small">validation · source selection · screening</text><text x="550" y="604" text-anchor="middle" class="small">ranking · citation checks</text>
  <rect x="790" y="535" width="250" height="85" rx="12" fill="#E1D5E7" stroke="#9673A6" stroke-width="2"/><text x="915" y="568" text-anchor="middle" class="box">Bounded local model adapter</text><text x="915" y="592" text-anchor="middle" class="small">Review and Explanation roles only</text>
  <rect x="1080" y="535" width="160" height="85" rx="12" fill="#F5F5F5" stroke="#666666" stroke-width="2"/><text x="1160" y="568" text-anchor="middle" class="box">Local Ollama</text><text x="1160" y="592" text-anchor="middle" class="small">no hosted dependency</text>
  <text x="40" y="728" class="sub">Roles cannot delegate, call one another, choose tools, write preferences, or publish results. The controller validates every handoff.</text>
</svg>
