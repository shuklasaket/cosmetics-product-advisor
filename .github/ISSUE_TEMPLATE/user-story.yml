name: User story
description: Plan one independently reviewable outcome from an existing PRD.
title: "[Story] "
labels: ["type:story", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [the story workflow](https://github.com/shuklasaket/cosmetics-product-advisor/blob/main/docs/story-workflow.md).
        GitHub assigns the number after creation: issue #42 becomes US-042.
        Add exactly one prd:NN label and link this story as a sub-issue of its PRD tracking issue.
        Describe the user goal with As a / I want / so that, and acceptance with numbered Given/When/Then scenarios.
        Keep unresolved questions visible; backlog stories do not need to be ready yet.
  - type: input
    id: prd
    attributes:
      label: PRD
      description: Link the parent document using its PRD-NN label.
      placeholder: "[PRD-01](https://github.com/shuklasaket/cosmetics-product-advisor/blob/main/docs/requirements/01-catalog-and-search.md)"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: PRD tracking issue
      description: Existing parent issue URL; also set the native parent relationship after creation.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: PRD requirement IDs
      description: List the actual parent PRD requirement IDs this story covers; reference them in the acceptance scenarios.
      placeholder: "CAT-05, CAT-07"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: State the user goal with As a / I want / so that. Include priority with its reason and a rough size with assumptions.
      placeholder: |
        As a [user or operator],
        I want [capability],
        so that [benefit].

        Priority: [priority and reason]
        Rough size: [estimate and assumptions]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State the included behavior and explicit exclusions. Keep acceptance focused on this boundary.
      placeholder: |
        Included:
        - [behavior delivered]

        Excluded:
        - [related behavior outside this story]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use stable AC-1, AC-2, etc. IDs and Given/When/Then scenarios. Give each scenario one main action and concrete observable outcomes. Cover relevant success, boundary, invalid-input, empty-result, and failure/recovery cases.
      placeholder: |
        AC-1 — [behavior] ([PRD requirement ID])
        Given [initial state and required inputs]
        And [additional precondition, if needed]
        When [one user or system action occurs]
        Then [concrete observable outcome]
        And [related observable outcome, if needed]

        AC-2 — [another relevant case] ([PRD requirement ID])
        Given [initial state]
        When [action occurs]
        Then [observable outcome]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and parallel work
      description: Blocking issue URLs (or None), shared contracts/files and their owners, and stories safe to run together. Set native blocking relationships too.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Questions and decisions
      description: Unresolved material questions, decision owner, and recorded answers/assumptions; use None when resolved.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifact impact
      description: Assess code/tests, config/.env.example, dependencies/lock/exports, schemas/migrations, data instructions, diagrams, ADRs, Markdown, and CHANGELOG.md. Identify expected updates or explain why they do not apply.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and evidence
      description: Map every AC-N to a planned test/check and its fixtures or genuine evidence. Include rollout/recovery needs. At completion, record actual test references/results, limitations, and the PR link.
      placeholder: |
        | Criterion | Planned test/check | Fixtures or evidence | Result / PR |
        | --- | --- | --- | --- |
        | AC-1 | [test/check] | [synthetic, recorded, or genuine] | Planned |
        | AC-2 | [test/check] | [synthetic, recorded, or genuine] | Planned |

        Rollout/recovery: [steps or justified N/A]
    validations:
      required: true
