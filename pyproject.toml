[project]
name = "cosmetics-product-advisor"
version = "0.0.1"
description = "Local, evidence-based cosmetic product advisor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
  "mypy>=1,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
required-version = "==0.13.1"
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app.py", "schemas", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--disable-socket", "--allow-unix-socket", "-m", "not live"]
markers = [
  "live: explicit, opt-in source/model checks excluded from routine verification",
]
